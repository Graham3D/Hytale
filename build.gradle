plugins {
    id 'java'
}

group = maven_group
version = project.version

def hytaleHome = file("${System.getProperty('user.home')}/AppData/Roaming/Hytale")
def gamePackage = file("${hytaleHome}/install/${patchline}/package/game/latest")
def serverJar = file("${gamePackage}/Server/HytaleServer.jar")
def assetsZip = file("${gamePackage}/Assets.zip")
def htDevLibJar = file("${hytaleHome}/UserData/Saves/RPG/mods/HYTALEDEVLIB-0.5.0.jar")

if (!serverJar.exists()) {
    throw new GradleException("Hytale server jar not found: ${serverJar}")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

dependencies {
    compileOnly files(serverJar)
    compileOnly files(htDevLibJar)
}

tasks.register('validateCustomUi', Exec) {
    group = 'verification'
    description = 'Rejects malformed CustomUI documents before resources are packaged.'
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('tools/Test-CustomUIDocuments.ps1'), '-Path', projectDir
}

allprojects {
    tasks.matching { it.name == 'processResources' }.configureEach {
        dependsOn rootProject.tasks.named('validateCustomUi')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.processResources {
    inputs.property('version', project.version)
    inputs.property('rpgRevision', rpg_revision)
    inputs.property('hytaleVersion', hytale_version)
    filesMatching(['manifest.json', 'rpg-build.properties']) {
        expand(version: project.version, rpgRevision: rpg_revision, hytaleVersion: hytale_version)
    }
}

tasks.register('printAuditClasspath') {
    doLast {
        println "serverJar=${serverJar}"
        println "assetsZip=${assetsZip}"
        println "htDevLibJar=${htDevLibJar}"
        println "rpgRevision=${rpg_revision}"
    }
}
