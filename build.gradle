plugins {
    id 'java'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.11' apply false
}

// Coverage and bytecode analysis are explicit engineering runs, not routine check work.
def guardianCoverage = providers.gradleProperty('guardianCoverage').map { it == 'true' }.getOrElse(false)
def guardianSpotBugs = providers.gradleProperty('guardianSpotBugs').map { it == 'true' }.getOrElse(false)
def guardianSpotBugsReport = providers.gradleProperty('guardianSpotBugsReport').map { it == 'true' }.getOrElse(false)
if (guardianSpotBugs) { apply plugin: 'com.github.spotbugs' }

jacoco { toolVersion = '0.8.15' }
tasks.withType(Test).configureEach { jacoco.enabled = guardianCoverage }
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports { xml.required = true; html.required = true }
}
tasks.register('guardianCoverage', JacocoReport) {
    group = 'verification'
    description = 'Opt-in root coverage including standard and native-control JUnit tests.'
    dependsOn tasks.named('test'), tasks.named('nativeControlTest')
    executionData files(layout.buildDirectory.file('jacoco/test.exec'),
        layout.buildDirectory.file('jacoco/nativeControlTest.exec'))
    sourceSets sourceSets.main
    reports { xml.required = true; html.required = true }
    onlyIf { guardianCoverage }
}

if (guardianSpotBugs) {
    allprojects {
        plugins.withId('com.github.spotbugs') {
            spotbugs { toolVersion = '4.10.2' }
            tasks.matching { it.name == 'spotbugsTest' }.configureEach { enabled = false }
            tasks.matching { it.name == 'spotbugsMain' }.configureEach {
                ignoreFailures = guardianSpotBugsReport
                if (!guardianSpotBugsReport) {
                    def baseline = file("${rootProject.projectDir}/config/spotbugs/${project.name}-baseline.xml")
                    if (baseline.exists()) { baselineFile = baseline }
                }
                reports {
                    xml.required = true
                    html.required = true
                }
            }
        }
    }
    tasks.register('guardianSpotBugs') {
        group = 'verification'
        description = 'Opt-in production bytecode analysis for HyARPG, CanvasUI, and Taverns.'
        dependsOn ':spotbugsMain', ':canvas-ui:spotbugsMain', ':hytale-taverns:spotbugsMain'
    }
}

group = maven_group
version = project.version
// Merged HyARPG + Tavern artifact. Existing gameplay and presentation data roots are retained.
tasks.named('jar') { archiveFileName = 'HyARPG.jar' }

def hytaleHome = file("${System.getProperty('user.home')}/AppData/Roaming/Hytale")
def gamePackage = file("${hytaleHome}/install/${patchline}/package/game/latest")
def serverJar = file("${gamePackage}/Server/HytaleServer.jar")
def packboundServerJar = file("${projectDir}/build/native-patch/HytaleServer-packbound.jar")
def assetsZip = file("${gamePackage}/Assets.zip")
def htDevLibJar = file("${hytaleHome}/data/${patchline}/Saves/RPG/mods/HYTALEDEVLIB-0.5.0.jar")

if (!serverJar.exists()) {
    throw new GradleException("Hytale server jar not found: ${serverJar}")
}

tasks.register('buildPackboundNative', Exec) {
    group = 'verification'
    description = 'Rebuild the version-pinned native Packbound and receipt hooks.'
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('tools/native-patch/Build-PackboundNative.ps1'), '-ServerJar', serverJar,
        '-OutputDirectory', file('build/native-patch')
}
tasks.named('compileJava') { dependsOn tasks.named('buildPackboundNative') }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories { mavenCentral() }

dependencies {
    implementation project(':canvas-ui')
    implementation project(':hytale-taverns')
    compileOnly project(':immersive-compat-api')
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.2'
    compileOnly files(packboundServerJar)
    compileOnly files(htDevLibJar)
    testImplementation files(packboundServerJar)
    testImplementation project(':canvas-ui')
    testImplementation project(':hytale-taverns')
    testImplementation project(':immersive-compat-api')
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.java {
    // The legacy bootstrap remains as source provenance for retained tests but is
    // not compiled or packaged. HyArpgPlugin is the sole production entrypoint.
    exclude 'com/inigmasgames/hytalerpg/phase00/Phase00Plugin.java'
}

tasks.register('validateCustomUi', Exec) {
    group = 'verification'
    description = 'Rejects malformed CustomUI documents before resources are packaged.'
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('tools/Test-CustomUIDocuments.ps1'), '-Path', projectDir
}

tasks.register('auditSpatialGrantAssets', Exec) {
    group = 'verification'
    description = 'Fails if an enabled asset or unreviewed project producer can grant directly to native inventory.'
    dependsOn tasks.named('processResources')
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('tools/Test-SpatialGrantAssets.ps1'), '-AssetsZip', assetsZip, '-ProjectRoot', projectDir
}

tasks.named('check') { dependsOn tasks.named('auditSpatialGrantAssets') }

tasks.register('auditNativeProcAssets', Exec) {
    group = 'verification'
    description = 'Checks every managed damage leaf against the pinned native strike and pellet graphs.'
    def bundledPython = file("${System.getProperty('user.home')}/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe")
    def python = providers.gradleProperty('pythonExecutable').getOrElse(bundledPython.exists() ? bundledPython.absolutePath : 'python')
    commandLine python, file('tools/New-NativeProcMetadata.py'), '--verify'
}
tasks.named('processResources') { dependsOn tasks.named('auditNativeProcAssets') }

allprojects {
    tasks.matching { it.name == 'processResources' }.configureEach {
        dependsOn rootProject.tasks.named('validateCustomUi')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.test {
    useJUnitPlatform()
    exclude '**/R244NamesTest*'
    exclude '**/R245FlockRollbackTest*'
    exclude '**/R244PopulationProjectionTest*'
    ['NativeAffix*Test', 'ManagedCarrierProductionTest', 'GearCombatProductionTest',
     'GearSignatureProcRuntimeTest', 'NativeGearActionProfilesTest', 'NativeTwinAssaultTest',
     'IronSentinelRestoredLeaseTest'].each { exclude "**/${it}*" }
    exclude '**/R023NativeRuneControlTest*'
    exclude '**/R024NativeInteractionAssetTest*'
    exclude '**/Stage09NativeManaTest*'
    exclude '**/Stage12NativeBiomeAssetTest*'
    exclude '**/Stage13NativeBasicPathTest*'
    exclude '**/Stage13NativeCadenceAuditTest*'
    exclude '**/Stage13NativeAbilityReadinessTest*'
    exclude '**/R071NativeAbilityProjectionRepairTest*'
    exclude '**/Stage13NativeProjectileConstructionTest*'
    exclude '**/Stage13SkillTreeIconsSearchTest*'
    exclude '**/Stage13NativeAttitudeCacheTest*'
    exclude '**/Stage13NativeHealingBeamTest*'
    exclude '**/MantleNativeSourceContractTest*'
    exclude '**/DifficultyNativeCommandTest*'
    exclude '**/GearQaNativeCommandTest*'
    exclude '**/ReadyPathNativeCommandTest*'
    exclude '**/InventoryProbeBagTest*'
    exclude '**/NativeContainerFilterBypassTest*'
    exclude '**/NativeEquipmentWriteTest*'
    exclude '**/NativeEnemyActionsStartTest*'
    exclude '**/SpatialBagAggregateTest*'
    exclude '**/GearQaSpatialDeliveryTest*'
    exclude '**/NativeWorkspaceGridTest*'
    exclude '**/NativeGearTargetGridTest*'
    exclude '**/GearStatusBindingsTest*'
    exclude '**/GearStatusAcceptanceIntegrationTest*'
    exclude '**/SentinelSourceConsumerTest*'
    exclude '**/SentinelConditionalActionTest*'
    exclude '**/MasterAffixCombatCompletionTest*'
    exclude '**/MasterAffixSentinel*Test*'
    exclude '**/MasterAffixSummonCompletionTest*'
    exclude '**/MasterAffixFinalControlsTest*'
    exclude '**/SignatureConsumerProofTest*'
    ['EnemyNativePaletteTest','EnemyNativeDamageLeafTest','EnemyNativeTimingTest',
     'EnemyNativeHealthTest','EnemyNativeDefenseTest','EnemyNativeOutgoingTest',
     'EnemyNativeProjectilePathTest','EnemyNativeStagingTest',
     'NativePackboundMutationHookTest'].each { exclude "**/${it}*" }
}

tasks.register('nativeControlTest', Test) {
    // Native asset classes cache their stores statically; isolate fixture owners.
    forkEvery = 1
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/R244NamesTest.class'
    include '**/R245FlockRollbackTest.class'
    include '**/R244PopulationProjectionTest.class'
    // Include native test classes before forking, avoiding empty worker JVMs.
        ['NativeAffix*Test', 'ManagedCarrierProductionTest', 'GearCombatProductionTest',
         'GearSignatureProcRuntimeTest', 'NativeGearActionProfilesTest', 'NativeTwinAssaultTest',
         'IronSentinelRestoredLeaseTest'].each { include "**/${it}.class" }
          include '**/R023NativeRuneControlTest.class'
          include '**/GearStatusBindingsTest.class'
          include '**/GearStatusAcceptanceIntegrationTest.class'
          include '**/SentinelSourceConsumerTest.class'
          include '**/SentinelConditionalActionTest.class'
          include '**/MasterAffixCombatCompletionTest.class'
          include '**/MasterAffixSentinel*Test.class'
          include '**/MasterAffixSummonCompletionTest.class'
          include '**/MasterAffixFinalControlsTest.class'
          include '**/SignatureConsumerProofTest.class'
        ['EnemyNativePaletteTest','EnemyNativeDamageLeafTest','EnemyNativeTimingTest',
         'EnemyNativeHealthTest','EnemyNativeDefenseTest','EnemyNativeOutgoingTest',
         'EnemyNativeProjectilePathTest','EnemyNativeStagingTest',
         'NativePackboundMutationHookTest'].each { include "**/${it}.class" }
        include '**/NativeEnemyActionsStartTest.class'
        include '**/R024NativeInteractionAssetTest.class'
        include '**/Stage09NativeManaTest.class'
        include '**/Stage12NativeBiomeAssetTest.class'
        include '**/Stage13NativeBasicPathTest.class'
        include '**/Stage13NativeCadenceAuditTest.class'
        include '**/Stage13NativeAbilityReadinessTest.class'
        include '**/R071NativeAbilityProjectionRepairTest.class'
        include '**/Stage13NativeProjectileConstructionTest.class'
        include '**/Stage13SkillTreeIconsSearchTest.class'
        include '**/Stage13NativeAttitudeCacheTest.class'
        include '**/Stage13NativeHealingBeamTest.class'
        include '**/MantleNativeSourceContractTest.class'
        include '**/DifficultyNativeCommandTest.class'
        include '**/GearQaNativeCommandTest.class'
        include '**/ReadyPathNativeCommandTest.class'
        include '**/InventoryProbeBagTest.class'
        include '**/NativeContainerFilterBypassTest.class'
        include '**/NativeEquipmentWriteTest.class'
        include '**/SpatialBagAggregateTest.class'
        include '**/GearQaSpatialDeliveryTest.class'
        include '**/NativeWorkspaceGridTest.class'
        include '**/NativeGearTargetGridTest.class'
    // Separate JVM: native codecs require Hytale's logger; retained UI tests exercise the JUL fallback.
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}
tasks.check {
    dependsOn tasks.named('nativeControlTest')
    dependsOn ':canvas-ui:check'
    dependsOn ':hytale-taverns:check'
}

tasks.register('verifyHyArpgJar', Exec) {
    group = 'verification'
    description = 'Validates the standalone HyARPG package and ownership boundary.'
    dependsOn tasks.named('jar')
    dependsOn tasks.named('auditSpatialGrantAssets')
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('tools/Test-HyArpgPackage.ps1'), '-JarPath', tasks.named('jar').get().archiveFile.get().asFile,
        '-ExpectedVersion', project.version, '-ExpectedRevision', rpg_revision
}

tasks.check {
    dependsOn tasks.named('verifyHyArpgJar')
}

tasks.register('auditU7P5AssetCompatibility', Exec) {
    group = 'verification'
    description = 'Offline U7P5 reference validation and frozen R176 hotfix semantics guard.'
    dependsOn tasks.named('jar')
    def bundledPython = file("${System.getProperty('user.home')}/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe")
    def python = providers.gradleProperty('pythonExecutable').getOrElse(bundledPython.exists() ? bundledPython.absolutePath : 'python')
    commandLine python, file('tools/Test-U7P5AssetCompatibility.py'),
        '--package', tasks.named('jar').get().archiveFile.get().asFile,
        '--assets-zip', assetsZip, '--report', file('build/reports/u7p5-asset-compatibility.json')
}
tasks.named('check') { dependsOn tasks.named('auditU7P5AssetCompatibility') }

tasks.processResources {
    def liveProbe = providers.gradleProperty('healingProbeLiveTest').map { it == 'true' }.getOrElse(false)
    inputs.property('healingProbeLiveTest', liveProbe)
    inputs.file(assetsZip)
    doLast {
        def stockPrefabPath = 'Server/Prefabs/Testing/VolumeShowcase/Trigger_Volume_Showcase.prefab.json'
        def stockAssets = new java.util.zip.ZipFile(assetsZip)
        try {
            def entry = stockAssets.getEntry(stockPrefabPath)
            if (entry == null) throw new GradleException("Stock trigger prefab missing: ${stockPrefabPath}")
            def original = stockAssets.getInputStream(entry).withCloseable { it.getText('UTF-8') }
            def unsafe = '"Type": "GiveItem"'
            if (original.split(java.util.regex.Pattern.quote(unsafe), -1).length != 2)
                throw new GradleException('Expected exactly one stock GiveItem effect in trigger showcase')
            def target = new File(destinationDir, stockPrefabPath)
            target.parentFile.mkdirs()
            target.setText(original.replace(unsafe, '"Type": "HywindSpatialGrant"'), 'UTF-8')
        } finally { stockAssets.close() }
        def marker = new File(destinationDir, 'healing-probe-live-test.txt')
        if (liveProbe) marker.text = 'R032-AP'
        else if (marker.exists()) marker.delete()
        def nativeAliasSections = new File(destinationDir, 'Common/UI/Custom/InventoryNativeAlias')
        def sectionTemplate = new File(nativeAliasSections, 'Section1.ui').getText('UTF-8')
        (2..1024).each { sectionId ->
            new File(nativeAliasSections, "Section${sectionId}.ui").setText(
                sectionTemplate.replace('InventorySectionId: 1;', "InventorySectionId: ${sectionId};"), 'UTF-8')
        }
        def nativeWorkspaceSections = new File(destinationDir, 'Common/UI/Custom/InventoryNativeWorkspace')
        def workspaceTemplate = new File(nativeWorkspaceSections, 'Section1.ui').getText('UTF-8')
        (2..1024).each { sectionId ->
            new File(nativeWorkspaceSections, "Section${sectionId}.ui").setText(
                workspaceTemplate.replace('InventorySectionId: 1;', "InventorySectionId: ${sectionId};"), 'UTF-8')
        }
        def gearTargetSections = new File(destinationDir, 'Common/UI/Custom/InventoryGearTargets')
        ['Weapon', 'Offhand', 'Head', 'Chest', 'Hands', 'Legs', 'RingLeft', 'RingRight'].each { slot ->
            def template = new File(gearTargetSections, "${slot}Section1.ui").getText('UTF-8')
            (2..1024).each { sectionId ->
                new File(gearTargetSections, "${slot}Section${sectionId}.ui").setText(
                    template.replace('InventorySectionId: 1;', "InventorySectionId: ${sectionId};"), 'UTF-8')
            }
        }
        def outsideDropSections = new File(destinationDir, 'Common/UI/Custom/InventoryDropTargets')
        def outsideDropTemplate = new File(outsideDropSections, 'OutsideSection1.ui').getText('UTF-8')
        (2..1024).each { sectionId ->
            new File(outsideDropSections, "OutsideSection${sectionId}.ui").setText(
                outsideDropTemplate.replace('InventorySectionId: 1;', "InventorySectionId: ${sectionId};"), 'UTF-8')
        }
    }
    inputs.property('version', project.version)
    def sourceCommit = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
    inputs.property('sourceCommit', sourceCommit)
    inputs.property('rpgRevision', rpg_revision)
    inputs.property('hytaleVersion', hytale_version)
    filesMatching(['manifest.json', 'rpg-build.properties']) {
        expand(version: project.version, rpgRevision: rpg_revision, hytaleVersion: hytale_version, sourceCommit: sourceCommit)
    }
    def gearLanguage = file('src/main/gearLanguage/server.lang')
    def tavernLanguage = file('hytale-taverns/src/main/tavernLanguage/server.lang')
    inputs.file(gearLanguage)
    inputs.file(tavernLanguage)
    doLast {
        def mergedLanguage = new File(destinationDir, 'Server/Languages/en-US/server.lang')
        mergedLanguage.append(System.lineSeparator() + gearLanguage.getText('UTF-8'), 'UTF-8')
        mergedLanguage.append(System.lineSeparator() + tavernLanguage.getText('UTF-8'), 'UTF-8')
    }
}

tasks.named('jar') {
    dependsOn ':canvas-ui:classes'
    dependsOn ':hytale-taverns:classes'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(project(':canvas-ui').sourceSets.main.output) {
        exclude 'manifest.json'
        exclude 'com/inigmasgames/canvasui/CanvasUIPlugin.class'
    }
    from(project(':hytale-taverns').sourceSets.main.output) {
        exclude 'manifest.json'
    }
}

tasks.register('printAuditClasspath') {
    doLast {
        println "serverJar=${serverJar}"
        println "assetsZip=${assetsZip}"
        println "htDevLibJar=${htDevLibJar}"
        println "rpgRevision=${rpg_revision}"
    }
}

tasks.register('generateEliteRoleMatrix', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath + files(packboundServerJar, htDevLibJar)
    mainClass = 'com.inigmasgames.hytalerpg.enemies.EnemyEliteRoleMatrix'
    args file('docs/enemies/ELITE_ROLE_MATRIX.md').absolutePath
}

// Exact installed campaign biome coverage; no runtime asset/world scan.
tasks.register('verifyCampaignBiomes', Exec) {
    group = 'verification'
    commandLine file("${System.getProperty('user.home')}/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe"),
        file('tools/Build-CampaignBiomeCoverage.py'), '--verify'
}
tasks.named('processResources') { dependsOn tasks.named('verifyCampaignBiomes') }
