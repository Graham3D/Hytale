plugins {
    id 'java-library'
    id 'maven-publish'
}

if (providers.gradleProperty('guardianCoverage').map { it == 'true' }.getOrElse(false)) {
    apply plugin: 'jacoco'
    jacoco { toolVersion = '0.8.15' }
    tasks.withType(Test).configureEach { jacoco.enabled = true }
    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports { xml.required = true; html.required = true }
    }
}
if (providers.gradleProperty('guardianSpotBugs').map { it == 'true' }.getOrElse(false)) {
    apply plugin: 'com.github.spotbugs'
}

group = 'com.inigmasgames.canvasui'
version = canvas_ui_version

def hytaleHome = file("${System.getProperty('user.home')}/AppData/Roaming/Hytale")
def serverJar = file("${hytaleHome}/install/${patchline}/package/game/latest/Server/HytaleServer.jar")

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

sourceSets.main.java {
    srcDir rootProject.file('canvas-ui-demo/src/main/java')
    exclude 'com/inigmasgames/canvasui/demo/CanvasUIDemoPlugin.java'
}

repositories { mavenCentral() }

dependencies {
    compileOnly files(serverJar)
    testImplementation files(serverJar)
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Javadoc).configureEach { options.addStringOption('Xdoclint:none', '-quiet') }
tasks.test { useJUnitPlatform() }
tasks.jar { archiveBaseName = 'CanvasUI' }
tasks.processResources {
    inputs.properties(version: project.version, rpgRevision: rpg_revision, hytaleVersion: hytale_version)
    filesMatching(['manifest.json', 'canvasui-build.properties']) {
        expand(version: project.version, rpgRevision: rpg_revision, hytaleVersion: hytale_version)
    }
}

publishing {
    publications { canvasUi(MavenPublication) { from components.java } }
}
